spring:
  application:
    name: ticketing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ticketing}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing} # chỉ dùng cho môi trường phát triển
  jpa:
    hibernate:
      ddl-auto: validate # schema do Flyway quản lý
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}
